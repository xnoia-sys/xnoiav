<!DOCTYPE html>
<html>
<body>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #020024, #090979, #0044ff);
        color: white;
    }

    /* Navigation Bar */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 30px;
        box-sizing: border-box;
    }

    /* Profile Button - Left Side */
    .profile-button {
        display: flex;
        align-items: center;
        gap: 10px;
        color: white;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
    }

    .profile-button img {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid white;
    }

    .profile-button:hover {
        color: #00d9ff;
    }

    /* Right Navigation */
    .nav-links {
        list-style: none;
        display: flex;
        gap: 30px;
        margin: 0;
        padding: 0;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        transition: 0.3s;
    }

    .nav-links a:hover {
        color: #00d9ff;
    }

    /* Xnoia Title */
    .hero {
        height: 50vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
    }

    .hero h1 {
        font-size: 80px;
        margin: 0;
    }

    .hero p {
        font-size: 22px;
    }

    /* Mobile */
    @media screen and (max-width: 600px) {

        .navbar {
            padding: 15px;
        }

        .profile-button span {
            display: none;
        }

        .profile-button img {
            width: 40px;
            height: 40px;
        }

        .nav-links {
            gap: 12px;
        }

        .nav-links a {
            font-size: 14px;
        }

        .hero h1 {
            font-size: 50px;
        }
    }
</style>

<nav class="navbar">

    <!-- Profile - Left Side -->
    <a href="profile.html" class="profile-button">
    <img id="homeProfilePic" src="profile.jpg" alt="Profile">
   
</a>

    <!-- Navigation - Right Side -->
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

</nav>

<div id="contact" style="padding:60px; color:white; text-align:center;">

    <h1 style="font-size:50px;">Contact Us</h1>

    <p>If you'd like to work with us or have any questions, feel free to contact us!</p>

    <div style="background-color:#1c2f6b; width:400px; margin:auto; padding:25px; border-radius:10px;">

        <p><strong>📧 Email:</strong> xnoia@email.com</p>

        <del><strong>📞 Phone:</strong> +63 912 345 6789</del>

        <p><strong>📍 Address:</strong> Philippines</p>

        <br>

        <form>

            <input type="text" placeholder="Your Name"
            style="width:90%; padding:10px; margin-bottom:10px;">

            <br>

            <input type="email" placeholder="Your Email"
            style="width:90%; padding:10px; margin-bottom:10px;">

            <br>

            <textarea placeholder="Your Message"
            style="width:90%; height:120px; padding:10px;"></textarea>

            <br><br>

            <button style="padding:10px 25px; background:#00d9ff; border:none; color:white; cursor:pointer;">
                Send Message
            </button>

        </form>

    </div>

</div>
<script>
					const savedPicture = localStorage.getItem("profilePicture");

					if (savedPicture) {
						document.getElementById("homeProfilePic").src = savedPicture;
					}
				</script>
</body>
</html>
